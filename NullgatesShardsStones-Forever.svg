<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Nullgate's Shards & Stones - Forever: a violet soul shard and a green healthstone, with fel sparks -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232d3d"/>
      <stop offset="1" stop-color="#0f141c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d27a"/>
      <stop offset="0.5" stop-color="#c9a54e"/>
      <stop offset="1" stop-color="#8a6a26"/>
    </linearGradient>
    <linearGradient id="shardL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2c6ff"/>
      <stop offset="1" stop-color="#7a3cd6"/>
    </linearGradient>
    <linearGradient id="shardR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a5ef0"/>
      <stop offset="1" stop-color="#3e1484"/>
    </linearGradient>
    <radialGradient id="stone" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#d6ffb0"/>
      <stop offset="0.45" stop-color="#5fd23a"/>
      <stop offset="1" stop-color="#1c6a12"/>
    </radialGradient>
    <radialGradient id="fel" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a66bff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#4a1aa0" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- frame -->
  <rect x="20" y="20" width="472" height="472" rx="64" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="64" fill="none" stroke="url(#gold)" stroke-width="16"/>
  <rect x="44" y="44" width="424" height="424" rx="44" fill="none" stroke="#c9a54e" stroke-opacity="0.35" stroke-width="3"/>

  <circle cx="256" cy="270" r="190" fill="url(#fel)"/>

  <!-- soul shard (left), tilted -->
  <g transform="rotate(-16 186 270)">
    <ellipse cx="186" cy="424" rx="70" ry="12" fill="#000000" opacity="0.35"/>
    <path d="M186 102 L246 218 L222 392 L150 392 L126 218 Z" fill="#b07aff" opacity="0.5" filter="url(#glow)"/>
    <path d="M186 102 L186 392 L150 392 L126 218 Z" fill="url(#shardL)"/>
    <path d="M186 102 L246 218 L222 392 L186 392 Z" fill="url(#shardR)"/>
    <path d="M186 102 L246 218 L222 392 L150 392 L126 218 Z" fill="none" stroke="#f0e2ff" stroke-width="5" stroke-linejoin="round"/>
    <path d="M126 218 L186 248 L246 218 M186 248 L186 392" fill="none" stroke="#f0e2ff" stroke-opacity="0.55" stroke-width="3"/>
    <path d="M160 200 L176 150" stroke="#ffffff" stroke-opacity="0.8" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- healthstone (right) -->
  <g transform="translate(0,24)">
    <ellipse cx="348" cy="398" rx="80" ry="14" fill="#000000" opacity="0.35"/>
    <path d="M348 214 C404 214 432 258 430 306 C428 356 392 384 348 384 C304 384 268 356 266 306 C264 258 292 214 348 214 Z" fill="#7fe04a" opacity="0.45" filter="url(#glow)"/>
    <path d="M348 214 C404 214 432 258 430 306 C428 356 392 384 348 384 C304 384 268 356 266 306 C264 258 292 214 348 214 Z" fill="url(#stone)" stroke="#e2ffd0" stroke-width="5"/>
    <!-- facets -->
    <path d="M300 258 L348 238 L396 258 L408 318 L348 360 L288 318 Z" fill="none" stroke="#e2ffd0" stroke-opacity="0.45" stroke-width="3" stroke-linejoin="round"/>
    <path d="M348 238 L348 360 M288 318 L408 318" stroke="#e2ffd0" stroke-opacity="0.3" stroke-width="3"/>
    <path d="M306 268 Q316 246 338 240" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- fel sparks -->
  <path d="M352 104 l8 22 l22 8 l-22 8 l-8 22 l-8 -22 l-22 -8 l22 -8 Z" fill="#c3ff8a"/>
  <path d="M96 150 l6 15 l15 6 l-15 6 l-6 15 l-6 -15 l-15 -6 l15 -6 Z" fill="#c79bff"/>
  <path d="M426 410 l6 15 l15 6 l-15 6 l-6 15 l-6 -15 l-15 -6 l15 -6 Z" fill="#c79bff"/>
  <circle cx="276" cy="140" r="6" fill="#e7d4ff"/>
  <circle cx="420" cy="196" r="5" fill="#c3ff8a" opacity="0.8"/>
</svg>
